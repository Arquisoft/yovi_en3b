openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: API for managing users
paths:
  /createuser:
    post:
      tags: [Users]
      summary: Creates a new user
      description: Creates a new user with the given nickname, username, email, password and photo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nickname
                - username
                - email
                - password
                - photo
              properties:
                username:
                  type: string
                  example: "testuser"
                nickname:
                  type: string
                  example: "testuser"
                email:
                  type: string
                  example: "testuser@testuser"
                photo:
                  type: string
                  example: "photo"
                password:
                  type: string
                  example: "123456"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Welcome testuser"
        "400":
          description: Error creating user (some fields missing or there exist another user with that critical information)
        "500":
          description: Database server error
  /findUserByUsername:
    get:
      tags: [Users]
      summary: Searches for a user
      description: Searches for a user with that username and returns it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  example: "testuser"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    example: "testuser"
                  nickname:
                    type: string
                    example: "testuser"
                  email:
                    type: string
                    example: "testuser@testuser"
                  photo:
                    type: string
                    example: "photo"
        "400":
          description: The username is required
        "404":
          description: It did not find a user with that username
        "500":
          description: Database server error.
  /loginUser:
    post:
      tags: [Users]
      summary: Log in of a user
      description: It compares the credentials passed to give access to the application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "testuser"
                password:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: User logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    example: "testuser"
                  nickname:
                    type: string
                    example: "testuser"
                  email:
                    type: string
                    example: "testuser@testuser"
                  photo:
                    type: string
                    example: "photo"
        "400":
          description: Missing fields
        "401":
          description: Invalid username or password
        "500":
          description: Database server error
  /changePassword:
    post:
      tags: [Users]
      summary: Change the password of a user
      description: It takes the credentials of the user to check his authorization and changes his password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - newPassword
              properties:
                username:
                  type: string
                  example: "testuser"
                password:
                  type: string
                  example: "123456"
                newPassword:
                  type: string
                  example: "hola123456"
      responses:
        "200":
          description: Password correctly changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    example: "testuser"
                  nickname:
                    type: string
                    example: "testuser"
                  email:
                    type: string
                    example: "testuser@testuser"
                  photo:
                    type: string
                    example: "photo"
        "401":
          description: Invalid username or password
        "500":
          description: Database server error
  /changeNickname:
    post:
      tags: [Users]
      summary: Change the nickname of a user
      description: It takes the username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - nickname
              properties:
                username:
                  type: string
                  example: "testuser"
                nickname:
                  type: string
                  example: "paco123"
      responses:
        "200":
          description: nickname correctly changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                    example: "testuser"
                  nickname:
                    type: string
                    example: "paco123"
                  email:
                    type: string
                    example: "testuser@testuser"
                  photo:
                    type: string
                    example: "photo"
        "401":
          description: User not found
        "500":
          description: Database server error
